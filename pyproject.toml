[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planetarble"
version = "0.1.0"
description = "Reproducible pipeline for generating global PMTiles from open data sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
authors = [
  { name = "Planetarble Contributors" }
]
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32.0",
  "pystac>=1.10.0",
  "pystac-client>=0.7.8",
  "Pillow>=13.0"
]
# GDAL's Python bindings (osgeo) and numpy are deliberately not listed.
# osgeo must match the system libgdal, and its gdal_array module is compiled
# against the system numpy, so a newer numpy installed into the venv would
# shadow it and break gdal_array. Create the venv with
# `uv venv --python /usr/bin/python3 --system-site-packages` so both come from
# the OS packages (python3-gdal pulls in python3-numpy). Collection-only hosts
# need neither.

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-requests==2.33.0.20261030",
  "types-PyYAML==6.0.12.20261113",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations raised from planetarble code fail the suite, so removals in
# newer Pythons (e.g. datetime.utcnow) surface in CI rather than in a run.
filterwarnings = ["error::DeprecationWarning:planetarble.*"]

[tool.mypy]
# Gradual typing: default (non-strict) checks over src/. GDAL, numpy, PIL and
# pyvips are optional system/runtime dependencies without bundled stubs.
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["osgeo.*", "pyvips.*", "numpy.*", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# F: undefined names and unused imports (the safety net for code that tests
#    do not reach). E/W: pycodestyle errors and whitespace. I: import order.
# B: bugbear (likely bugs, e.g. zip() without strict=).
# Line length (E501) is not enforced; the code base predates a formatter.
select = ["F", "E", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# numpy-dependent tests call pytest.importorskip("numpy") before importing
# the modules that need it, so collection-only hosts skip instead of failing.
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["planetarble"]

[project.scripts]
planetarble = "planetarble.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"planetarble" = ["viewer/*.html", "data/ocean/*.json"]
